name: Feature request
description: Suggest an improvement or new capability.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should this template make easier?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to change or add?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - apps/web
        - apps/mobile
        - packages/ui
        - packages/starter
        - tooling
        - documentation
        - other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional context, tradeoffs, or links.
